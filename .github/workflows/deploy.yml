name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual deployment

env:
  NODE_VERSION: '20'

jobs:
  # Run CI checks first
  ci-checks:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci-checks
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Deployment gate (Dokploy auto-deploys the GHCR image)
        run: |
          echo "🚀 Deploying to production..."
          echo "All tests passed - deployment proceeding"
          # The actual deploy is build-and-push.yml -> GHCR -> Dokploy auto-deploy.
          # This step only records that the CI gate passed for this ref.

      - name: Post-deployment verification
        run: |
          echo "✅ Deployment completed"
          echo "🔍 Running post-deployment checks..."
          # Add any post-deployment verification here

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: ci-checks
    if: github.ref == 'refs/heads/development'
    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to Development
        run: |
          echo "🚀 Deploying to development environment..."
          echo "All tests passed - deployment proceeding"
