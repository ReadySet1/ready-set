name: release-please

# Watches `main` and proposes a release PR after each sync from
# `development`. When the release PR merges, this workflow tags the
# commit and creates a GitHub Release. See CLAUDE.md → "Versioning"
# and docs/release-please-config.json for the configuration.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a release PR is open/updated, regenerate the user-facing
      # changelog data from commit `Changelog:` trailers and commit it onto
      # the release branch for human review before merge. Additive + no-op
      # when no release PR exists.
      - name: Checkout (for changelog regeneration)
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate user-facing changelog
        if: ${{ steps.release.outputs.pr }}
        env:
          RELEASE_PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_PR_BRANCH"
          git checkout "$RELEASE_PR_BRANCH"
          node scripts/build-changelog.mjs

      # Committed through the contents API rather than `git commit` + `git push`
      # so that GitHub signs it. `main` requires verified signatures, and a
      # locally-made bot commit is unsigned, which blocked every release PR on
      # "Commits must have verified signatures" — release-please's own commits
      # were fine because the action already writes them through the API.
      - name: Commit user-facing changelog
        if: ${{ steps.release.outputs.pr }}
        uses: actions/github-script@v7
        env:
          RELEASE_PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        with:
          script: |
            const fs = require('fs');
            const path = 'src/data/changelog.json';
            const branch = process.env.RELEASE_PR_BRANCH;
            const content = fs.readFileSync(path, 'utf8');

            const { data: current } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch,
            });

            if (Buffer.from(current.content, 'base64').toString('utf8') === content) {
              core.info('No changelog.json changes to commit.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: 'chore: update user-facing changelog from commit trailers',
              content: Buffer.from(content, 'utf8').toString('base64'),
              sha: current.sha,
            });
            core.info(`Committed ${path} to ${branch}.`);
