name: Build & Push Image

# Builds the production Docker image in CI (off the VPS) and pushes it to GHCR.
# The self-host box (Dokploy on the arm64 Hetzner host) then pulls and runs the
# prebuilt image — so no `next build` ever runs on the server. This is the
# replacement for Vercel's (billed) build step. Built multi-arch (amd64+arm64).
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Variables (non-secret, baked into the client bundle at build time):
#     NEXT_PUBLIC_SUPABASE_URL
#     NEXT_PUBLIC_FF_USE_REALTIME_LOCATION_UPDATES
#     NEXT_PUBLIC_FF_USE_REALTIME_ADMIN_DASHBOARD
#     NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
#     NEXT_PUBLIC_SENTRY_ENVIRONMENT
#     NEXT_PUBLIC_FF_USE_REALTIME_TRACKING
#     NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
#     NEXT_PUBLIC_RECAPTCHA_SITE_KEY
#     NEXT_PUBLIC_SITE_URL
#     NEXT_PUBLIC_CATER_VALLEY_API_URL
#     NEXT_PUBLIC_CATER_VALLEY_PARTNER_HEADER
#     NEXT_PUBLIC_SANITY_PROJECT_ID
#     NEXT_PUBLIC_SANITY_DATASET
#     NEXT_PUBLIC_SANITY_API_VERSION
#   Secrets:
#     NEXT_PUBLIC_SUPABASE_ANON_KEY   (public anon key, but kept as secret)
#     NEXT_PUBLIC_SENTRY_DSN
#     BUILD_DATABASE_URL              (optional: only if pages hit the DB at build)
#     BUILD_DIRECT_URL                (optional)
#     DOKPLOY_DEV_DEPLOY_WEBHOOK      (optional: dev app's deploy webhook —
#                                      https://dokploy.readysetllc.com/api/deploy/<refreshToken>)
#     DOKPLOY_PROD_DEPLOY_WEBHOOK     (optional: prod app's deploy webhook, same shape)
#     DEV_NEXT_PUBLIC_SUPABASE_ANON_KEY / DEV_BUILD_DATABASE_URL / DEV_BUILD_DIRECT_URL
#       — rs-dev counterparts used for non-main builds (see the DEV_ vars too:
#       DEV_NEXT_PUBLIC_SUPABASE_URL, DEV_NEXT_PUBLIC_SENTRY_ENVIRONMENT).
#       main builds a production-flavored client bundle; development builds a
#       dev-flavored one (rs-dev Supabase + Sentry env=development).
#
# NOTE: runtime server secrets (real DATABASE_URL, Supabase service key, Stripe,
# SendGrid/Resend, Cloudinary, etc.) are set in DOKPLOY's env, NOT here — they
# are not needed to build the image.

on:
  # Self-host VPS target is now live (Dokploy on the arm64 Hetzner box), so
  # auto-builds are RE-ENABLED — every push to these branches produces a fresh
  # multi-arch image the box can pull. Replaces Vercel's billed build step.
  push:
    branches: [main, development]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ReadySet1/ready-set -> ghcr.io/readyset1/ready-set

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Required to build linux/arm64 on the amd64 GitHub runner (emulation).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Serving host is the arm64 Hetzner box (Dokploy). amd64 kept for
          # flexibility / local x86 use. arm64 builds via QEMU emulation here —
          # if that gets too slow or OOMs, switch to a native arm64 runner
          # (runs-on: ubuntu-24.04-arm) with a per-arch matrix + manifest merge.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Branch-flavored client bundle: main bakes the production Supabase
          # project + Sentry env; every other ref (i.e. development) bakes the
          # rs-dev ones from the DEV_-prefixed repo vars/secrets. Only the values
          # that actually differ between the two Vercel env targets are switched;
          # everything else is shared. This is what lets the :development image
          # run against the dev database with matching client-side auth.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ github.ref == 'refs/heads/main' && vars.NEXT_PUBLIC_SUPABASE_URL || vars.DEV_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.DEV_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_FF_USE_REALTIME_LOCATION_UPDATES=${{ vars.NEXT_PUBLIC_FF_USE_REALTIME_LOCATION_UPDATES }}
            NEXT_PUBLIC_FF_USE_REALTIME_ADMIN_DASHBOARD=${{ vars.NEXT_PUBLIC_FF_USE_REALTIME_ADMIN_DASHBOARD }}
            NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ github.ref == 'refs/heads/main' && vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT || vars.DEV_NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_FF_USE_REALTIME_TRACKING=${{ vars.NEXT_PUBLIC_FF_USE_REALTIME_TRACKING }}
            NEXT_PUBLIC_CATER_VALLEY_API_URL=${{ vars.NEXT_PUBLIC_CATER_VALLEY_API_URL }}
            NEXT_PUBLIC_CATER_VALLEY_PARTNER_HEADER=${{ vars.NEXT_PUBLIC_CATER_VALLEY_PARTNER_HEADER }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_SANITY_API_VERSION=${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
            DATABASE_URL=${{ github.ref == 'refs/heads/main' && secrets.BUILD_DATABASE_URL || secrets.DEV_BUILD_DATABASE_URL }}
            DIRECT_URL=${{ github.ref == 'refs/heads/main' && secrets.BUILD_DIRECT_URL || secrets.DEV_BUILD_DIRECT_URL }}

      # Tell Dokploy to pull + redeploy the new image (closes the loop — the
      # Vercel-like "push -> live" flow). Each branch maps to its own Dokploy
      # application; the webhook URL embeds that app's refresh token, so no
      # auth header is needed. No-op if the branch's secret isn't set (then
      # deploy manually from the Dokploy panel).
      - name: Trigger Dokploy redeploy
        env:
          DEV_WEBHOOK: ${{ secrets.DOKPLOY_DEV_DEPLOY_WEBHOOK }}
          PROD_WEBHOOK: ${{ secrets.DOKPLOY_PROD_DEPLOY_WEBHOOK }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            development) WEBHOOK="$DEV_WEBHOOK" ;;
            main)        WEBHOOK="$PROD_WEBHOOK" ;;
            *)           WEBHOOK="" ;;
          esac
          if [ -z "$WEBHOOK" ]; then
            echo "No Dokploy deploy webhook configured for branch '$BRANCH' — skipping auto-redeploy."
            exit 0
          fi
          curl --fail --silent --show-error "$WEBHOOK"
          echo "Dokploy redeploy triggered for branch '$BRANCH'."
